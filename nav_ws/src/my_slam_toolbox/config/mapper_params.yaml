slam_toolbox:
  ros__parameters:
    # --- 坐标系设置（和底盘保持一致） ---
    odom_frame: odom_combined
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    
    # --- 运行模式 ---
    use_sim_time: false
    mode: mapping

    # --- 算法优化参数 ---
    # 地图分辨率（1像素 = 5厘米）
    resolution: 0.05
    # 雷达最大有效距离（太远的数据丢掉，防止算力爆炸）
    max_laser_range: 20.0
    # 最小移动距离（车走多少米才更新一次地图，防止原地画重影）
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    
    # --- 高级闭环参数 ---
    # 开启闭环检测（回到起点时自动纠正误差）
    do_loop_closing: true
    loop_search_maximum_distance: 8.0